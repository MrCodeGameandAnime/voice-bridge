name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore root/VoiceBridge.sln

      - name: Build
        run: dotnet build root/VoiceBridge.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test root/VoiceBridge.sln --configuration Release --no-build --no-restore
