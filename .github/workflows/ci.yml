name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore root/tests/VoiceBridge.Tests/VoiceBridge.Tests.csproj

      - run: dotnet build root/tests/VoiceBridge.Tests/VoiceBridge.Tests.csproj --configuration Release --no-restore

      - run: dotnet test root/tests/VoiceBridge.Tests/VoiceBridge.Tests.csproj --configuration Release --no-build --no-restore

  windows-build:
    name: Windows solution build (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - run: msbuild root\VoiceBridge.sln /restore /p:Configuration=Release
