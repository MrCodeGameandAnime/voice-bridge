name: Feature request
description: Suggest an improvement to Voice Bridge.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Describe the user need without including a real Takeout archive, database,
        private messages, phone numbers, or media.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the task or difficulty you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Voice Bridge to do?
      description: Describe the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Mention any workaround or other approach you considered.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included real Takeout content or other personal data.
          required: true
