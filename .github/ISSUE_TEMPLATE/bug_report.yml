name: Bug report
description: Report a reproducible problem in Voice Bridge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach a real Takeout archive, database, export, private messages,
        phone numbers, media, or unreviewed logs. Review and redact any details
        before sharing them.
  - type: input
    id: app-version
    attributes:
      label: Voice Bridge version
      description: Find the version in the app's About window.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11, version 26H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reliably reproduce the problem. Use synthetic examples.
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include issue codes or reviewed and redacted logs only.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included real Takeout content or unreviewed personal data.
          required: true
